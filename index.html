<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script type="module" src="index.js" defer></script>
    <link rel="stylesheet" href="buttons.css">
    <link rel="stylesheet" href="card.css">
    <link rel="stylesheet" href="select.css">
</head>
<body>
    

   <!--- buttons -->
    <button class="btn btn-jelly" id="add-todo">Add Item</button>
    <button class="btn btn-gradient" id="add-project">Add Project</button>
    <br>
    <br>
    <div class="select-wrapper">
        <label class="select-label" for="project-selector">Select Project</label>
        <div class="custom-select">
        <select id="project-selector"> </select>
        </select>
        </div>
    </div>

    <div id="todoList"></div>

    <!--- dialogs -->
    <dialog id="taskDialog">
        <form id="taskForm" method="dialog">
        <h3>New Task</h3>
        
        <div class="field">
            <label for="title">Task Title</label>
            <input type="text" id="title" name="title" required>
        </div>

        <div class="input-wrapper">
            <label for="description">Task Description</label>
            <textarea type="text" id="description" name="description" required></textarea>
        </div>

        <div class="field">
            <label for="due-date">Due date</label>
            <input type="date" id="due-date" name="due-date" required>
        </div>

        <div class="field">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
            </select>
        </div>

        <div class="field">
            <label for="project">Project</label>
            <select id="project" name="project"> </select>
            </select>
        </div>

        <div class="actions">
            <!-- formnovalidate lets Cancel bypass required fields -->
            <button class="btn btn-brutalist" type="submit" value="cancel" formnovalidate>Cancel</button>
            <button class="btn btn-brutalist" type="submit" value="confirm">Save Task</button>
        </div>
        </form>
    </dialog>

    <dialog id="projectsDialog">
        <form id="projectsForm" method="dialog">
  
        <div class="field">
            <label for="project">Project</label>
            <input type="text" id="projectName" name="projectName" required>
        </div>

        <div class="actions">
            <!-- formnovalidate lets Cancel bypass required fields -->
            <button class="btn btn-neon" type="submit" value="cancel" formnovalidate>Cancel</button>
            <button class="btn btn-neon" type="submit" value="confirm">Save Project</button>
        </div>
        </form>
    </dialog>


    <!-- Shared Expanded Card Modal -->
    <dialog id="task-modal" class="task-modal">
        <div class="task-modal__content">
            <div class="task-card__header">
            <span id="modal-project" class="task-card__project"></span>
            <div class="task-modal__actions">
                <span id="modal-priority" class="task-card__priority"></span>
                <button id="modal-close" class="task-modal__close" aria-label="Close">&times;</button>
            </div>
            </div>

            <h2 id="modal-title" class="task-modal__title"></h2>
            
            <!-- Scrollable body for variable/long content -->
            <div id="modal-description" class="task-modal__body"></div>

            <div class="task-card__footer">
            <span id="modal-due-date" class="task-card__due-date"></span>
            </div>
        </div>
    </dialog>
</body>
</html>
